<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل المستوى الأول</title>
  <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
  <style>
    body{font-family:Tahoma,sans-serif;background:#f5f5f5;padding:20px;max-width:640px;margin:auto}
    .card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    label{display:block;margin-top:12px;font-weight:bold}
    input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font-family:inherit}
    button{background:#0a7c42;color:#fff;padding:12px 20px;border:none;border-radius:6px;cursor:pointer;font-size:16px;margin-top:16px;width:100%}
    button:disabled{opacity:.5;cursor:not-allowed}
    .hidden{display:none}
    .msg{margin-top:12px;padding:10px;border-radius:6px}
    .err{background:#fee;color:#a00}
    .ok{background:#efe;color:#060}
  </style>
</head>
<body>
<div class="card">
  <h2 style="text-align:center">استمارة تسجيل المستوى الأول</h2>
  <p style="text-align:center;color:#666">كلية علوم الرياضة للبنين</p>

  <div id="step1">
    <label>الرقم القومي (14 رقمًا)</label>
    <input id="nid" type="text" inputmode="numeric" maxlength="14" placeholder="30xxxxxxxxxxxx">
    <button onclick="checkEligibility()">تحقق وابدأ</button>
    <div id="msg1"></div>
  </div>

  <form id="form" class="hidden" onsubmit="submitForm(event)">
    <div id="welcome" style="color:#060;font-weight:bold;margin:12px 0"></div>

    <label>الاسم رباعي (عربي)</label>
    <input id="fnAr" required pattern="[\u0600-\u06FF\s]{6,}">

    <label>الاسم رباعي (إنجليزي)</label>
    <input id="fnEn" required pattern="[A-Za-z\s]{6,}">

    <label>تليفون منزل (اختياري)</label>
    <input id="homePhone" type="tel" inputmode="numeric" pattern="\d{7,9}">

    <label>تليفون محمول</label>
    <input id="mobile" required pattern="01[0125]\d{8}" inputmode="numeric" maxlength="11">

    <label>المحافظة</label>
    <select id="gov" required>
      <option value="">اختر...</option>
      <option>القاهرة</option><option>الجيزة</option><option>الإسكندرية</option>
      <option>الدقهلية</option><option>الشرقية</option><option>المنوفية</option>
      <option>القليوبية</option><option>البحيرة</option><option>الغربية</option>
      <option>بورسعيد</option><option>دمياط</option><option>الإسماعيلية</option>
      <option>السويس</option><option>كفر الشيخ</option><option>الفيوم</option>
      <option>بني سويف</option><option>المنيا</option><option>أسيوط</option>
      <option>سوهاج</option><option>قنا</option><option>الأقصر</option>
      <option>أسوان</option><option>البحر الأحمر</option><option>الوادي الجديد</option>
      <option>مطروح</option><option>شمال سيناء</option><option>جنوب سيناء</option>
    </select>

    <label>الصورة الشخصية (JPEG / JPG)</label>
    <input id="img" type="file" accept="image/jpeg,image/jpg" required>

    <button id="submitBtn" type="submit">تسجيل</button>
    <div id="msg2"></div>
  </form>
</div>

<script>
// ✏️ عدّل السطور الثلاثة دي من مفكرتك:
const SUPABASE_URL = 'https://dlvqfwtfeyuzljyzclbu.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRsdnFmd3RmZXl1emxqeXpjbGJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyMzQwMjksImV4cCI6MjEwOTgxMDAyOX0.uDy1dxBFLQpH39MhakAm1269soBdRsaptJMYB79kfMs';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxXj--ts-l_qiUlWpToQQCbLU_7dGOTBv8EIg1uvUQsysgcH3mF5uMGYiSksoGTKp2HXQ/exec
';

let CURRENT_YEAR = 2025;

(async () => {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/app_settings?select=key,value`,
    { headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } });
  const s = await r.json();
  CURRENT_YEAR = parseInt(s.find(x => x.key === 'current_year')?.value || '2025');
})();

async function checkEligibility() {
  const nid = document.getElementById('nid').value.trim();
  const m = document.getElementById('msg1');
  if (!/^30\d{12}$/.test(nid)) return m.className = 'msg err', m.textContent = 'الرقم القومي يجب أن يكون 14 رقمًا يبدأ بـ 30';

  const r = await fetch(`${SUPABASE_URL}/rest/v1/eligible_students?academic_year=eq.${CURRENT_YEAR}&national_id=eq.${nid}&select=full_name_ar`,
    { headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } });
  const data = await r.json();
  if (!data.length) return m.className = 'msg err', m.textContent = '❌ رقمك غير موجود في قائمة الطلاب المؤهلين';

  document.getElementById('welcome').textContent = 'أهلًا: ' + data[0].full_name_ar;
  document.getElementById('step1').classList.add('hidden');
  document.getElementById('form').classList.remove('hidden');
}

async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const m = document.getElementById('msg2');
  btn.disabled = true;
  btn.textContent = 'جارٍ المعالجة...';

  try {
    const file = document.getElementById('img').files[0];
    if (!file) throw new Error('اختر صورة');
    const compressed = await imageCompression(file, { maxSizeMB: 0.38, maxWidthOrHeight: 1024, useWebWorker: true });
    const base64 = await new Promise((res, rej) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result.split(',')[1]);
      fr.onerror = rej;
      fr.readAsDataURL(compressed);
    });

    const payload = {
      action: 'register',
      nationalId: document.getElementById('nid').value.trim(),
      fullNameAr: document.getElementById('fnAr').value.trim(),
      fullNameEn: document.getElementById('fnEn').value.trim(),
      homePhone: document.getElementById('homePhone').value.trim(),
      mobilePhone: document.getElementById('mobile').value.trim(),
      governorate: document.getElementById('gov').value,
      imageBase64: base64
    };

    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST', body: JSON.stringify(payload),
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    });
    const result = await r.json();
    if (result.error) throw new Error(result.error);
    m.className = 'msg ok';
    m.textContent = '✅ تم التسجيل بنجاح!';
    document.getElementById('form').reset();
  } catch (err) {
    m.className = 'msg err';
    m.textContent = '❌ ' + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'تسجيل';
  }
}
</script>
</body>
</html>
